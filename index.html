<!doctype html>
<html >
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PaymentLab - Stripe Gateway</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Stripe -->
    <script src="https://js.stripe.com/v3/"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fira+Code:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-slate-900 text-white">
    <!-- Loading -->

    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
    </div>

    <!-- Header -->

    <header class="bg-slate-800 p-5 border-b border-slate-700">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-blue-400">
            <i class="fa-solid fa-credit-card"></i>

            PaymentLab
          </h1>

          <p class="text-sm text-slate-400">
            ASP.NET Core Web API + Stripe Integration
          </p>
        </div>

        <span class="bg-green-500/20 text-green-400 px-3 py-2 rounded">
          .NET Ready
        </span>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-8">
      <!-- ================= Hosted ================= -->

      <section class="card">
        <h2 class="text-xl font-bold text-blue-400 mb-5">
          <i class="fa-solid fa-globe"></i>

          Hosted Checkout
        </h2>

        <form id="hosted-form" class="space-y-4">
          <input
            id="hosted-product"
            class="bg-slate-900 border border-slate-700 rounded-lg p-4"
            value="Premium Subscription"
            placeholder="Product Name"
          />

          <input
            id="hosted-amount"
            class="bg-slate-900 border border-slate-700 rounded-lg p-4"
            type="number"
            value="100"
            placeholder="Amount"
          />

          <button class="bg-blue-600 hover:bg-blue-500 px-5 py-3 rounded-lg">
            Start Hosted Checkout
          </button>
        </form>
      </section>

      <!-- ================= Embedded ================= -->

      <section class="card">
        <h2 class="text-xl font-bold text-purple-400 mb-5">
          <i class="fa-solid fa-window-maximize"></i>

          Embedded Checkout
        </h2>

        <form id="embedded-form" class="space-y-4">
          <input id="embedded-amount" class="bg-slate-900 border border-slate-700 rounded-lg p-4" type="number" value="50" />

          <button class="bg-purple-600 px-5 py-3 rounded-lg">
            Create Payment Intent
          </button>
        </form>

        <div
          id="payment-element"
          class="mt-6 bg-slate-950 p-5 rounded-lg"
        ></div>

        <button
          id="confirm-payment"
          class="hidden mt-4 bg-green-600 px-5 py-3 rounded-lg"
        >
          Confirm Payment
        </button>
      </section>

      <!-- ================= Direct ================= -->

      <section class="card">
        <h2 class="text-xl font-bold text-yellow-400 mb-5">
          <i class="fa-solid fa-bolt"></i>

          Direct Card Payment
        </h2>

        <p class="text-red-400 text-sm mb-4">
          Testing only - Do not use in production
        </p>

        <form id="direct-form" class="space-y-3">
         
          <input id="direct-amount" value="50" placeholder="amount" type="number"
     class="bg-slate-900 border border-slate-700 rounded-lg p-4">
        </input>

        <div id="card-element"
     class="w-full rounded-xl border border-slate-600 bg-slate-800 px-4 py-3 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/30">
      </div>

          <button class="bg-yellow-600 px-5 py-3 rounded-lg">
            Charge Card
          </button>
        </form>
      </section>

      <!-- ================= Webhook ================= -->

      <section class="card">
        <h2 class="text-xl font-bold text-red-400 mb-5">
          <i class="fa-solid fa-shield"></i>

          Webhook Test
        </h2>

        <textarea id="webhook-json" rows="8">

          {
          "type":"checkout.session.completed",
          "amount":100,
          "status":"paid"
         }

         </textarea
        >

        <button
          onclick="testWebhook()"
          class="mt-4 bg-red-600 px-5 py-3 rounded-lg"
        >
          Test Webhook
        </button>
      </section>

      <!-- ================= Console ================= -->

      <section class="card">
        <div class="flex justify-between mb-4">
          <h2 class="text-lg font-bold">API Console</h2>

          <button onclick="clearConsole()" class="text-red-400">Clear</button>
        </div>

        <div
          id="api-console"
          class="bg-black rounded-lg p-4 h-64 overflow-auto font-mono text-sm"
        ></div>
      </section>

      <!-- ================= History ================= -->

      <section class="card">
        <h2 class="text-xl font-bold mb-5">Payment History</h2>

        <div class="overflow-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-slate-400 border-b border-slate-700">
                <th class="p-3">Type</th>

                <th class="p-3">Amount</th>

                <th class="p-3">Status</th>

                <th class="p-3">ID</th>

                <th class="p-3">Date</th>
              </tr>
            </thead>

            <tbody id="payment-history"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="text-center p-5 text-slate-400">PaymentLab © 2026</footer>

    <!-- Scripts -->

    <script src="config.js"></script>

    <script src="api.js"></script>

    <script src="app.js"></script>
  </body>
</html>
